<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rango Wallet - Secure Crypto Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
        }
        
        .gradient-bg {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
        }
        
        .input-field {
            background-color: rgba(30, 41, 59, 0.7);
            border: 1px solid #334155;
            transition: all 0.3s ease;
        }
        
        .input-field:focus {
            border-color: #60a5fa;
            box-shadow: 0 0 0 3px rgba(96, 165, 250, 0.2);
        }
        
        .login-btn {
            background: linear-gradient(90deg, #3b82f6 0%, #6366f1 100%);
            transition: all 0.3s ease;
        }
        
        .login-btn:hover {
            background: linear-gradient(90deg, #6366f1 0%, #3b82f6 100%);
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
        }
        
        .error-message {
            animation: shake 0.5s;
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
            20%, 40%, 60%, 80% { transform: translateX(5px); }
        }
        
        .particle {
            position: absolute;
            background-color: rgb(255, 255, 255);
            border-radius: 50%;
            pointer-events: none;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 gradient-bg">
    <div id="particles-container" class="fixed inset-0 overflow-hidden"></div>
    
    <div class="relative z-10 w-full max-w-md">
        <div class="bg-slate-800/70 backdrop-blur-lg rounded-2xl shadow-xl overflow-hidden border border-slate-700/50">
            <div class="p-8">
                <div class="flex justify-center mb-8">
                    <div class="flex items-center space-x-3">
                        <div class="bg-blue-500 p-2 rounded-lg">
                            <i class="fas fa-wallet text-white text-2xl"></i>
                        </div>
                        <h1 class="text-2xl font-bold text-white">Rango Cold Wallet</h1>
                    </div>
                </div>
                
                <div class="mb-6 text-center">
                    <h2 class="text-xl font-semibold text-white">Secure Crypto Login</h2>
                    <p class="text-slate-400 mt-2">Access your decentralized assets</p>
                </div>
                
                <form id="loginForm" class="space-y-6">
                    <div>
                        <label for="username" class="block text-sm font-medium text-slate-300 mb-2">Username</label>
                        <div class="relative">
                            <input 
                                type="text" 
                                id="username" 
                                name="username" 
                                required 
                                class="w-full px-4 py-3 rounded-lg input-field text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500"
                                placeholder="Enter your username"
                            >
                            <div class="absolute inset-y-0 right-0 flex items-center pr-3">
                                <i class="fas fa-user text-slate-500"></i>
                            </div>
                        </div>
                    </div>
                    
                    <div>
                        <label for="passphrase" class="block text-sm font-medium text-slate-300 mb-2">Passphrase</label>
                        <div class="relative">
                            <input 
                                type="password" 
                                id="passphrase" 
                                name="passphrase" 
                                required 
                                class="w-full px-4 py-3 rounded-lg input-field text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500"
                                placeholder="Check hardware wallet authenticator device"
                            >
                            <div class="absolute inset-y-0 right-0 flex items-center pr-3">
                                <i class="fas fa-lock text-slate-500"></i>
                            </div>
                        </div>
                        <p class="mt-2 text-xs text-slate-500">Your passphrase is never stored or transmitted</p>
                    </div>
                    
                    <div id="errorMessage" class="hidden bg-red-900/50 text-red-200 px-4 py-3 rounded-lg text-sm error-message"></div>
                    
                    <button type="submit" class="w-full py-3 px-4 rounded-lg text-white font-medium login-btn focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 focus:ring-offset-slate-900">
                        Unlock Wallet
                    </button>
                </form>
                
                <div class="mt-6 text-center text-sm text-slate-500">
                    <p>Click on <b>Generate Passphrase</b> button on the authenticator device and follow the instructions </p>
                    
                </div>
            </div>
            
            <div class="bg-slate-900/50 px-6 py-4 border-t border-slate-700/50">
                <div class="flex items-center justify-between text-xs text-slate-500">
                    <span>Secure • Decentralized • Offline storage</span>
                    <span>v2.4.1</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Create particles
            createParticles();
            
            // Form submission
            const loginForm = document.getElementById('loginForm');
            const errorMessage = document.getElementById('errorMessage');
            
            loginForm.addEventListener('submit', function(e) {
                e.preventDefault();
                
                const username = document.getElementById('username').value;
                const passphrase = document.getElementById('passphrase').value;
                
                // Check credentials
                if (username === 'Melissa_Chavez01' && passphrase === 'laughter rural pizza eagle tornado helmet dolphin tiger bamboo mushroom orange galaxy') {
                    // Redirect to specified site
                    window.location.href = 'file:///C:/Users/Owner/Desktop/rango%20home%20and%20login/xRHP89349ed32d8h44f5083e1c400bga6.html';
                } else {
                    // Show error message
                    errorMessage.textContent = 'Username or passphrase incorrect';
                    errorMessage.classList.remove('hidden');
                    
                    // Shake animation
                    errorMessage.style.animation = 'none';
                    setTimeout(() => {
                        errorMessage.style.animation = 'shake 0.5s';
                    }, 10);
                    
                    // Clear form
                    document.getElementById('passphrase').value = '';
                }
            });
            
            // Clear error when typing
            const inputs = document.querySelectorAll('input');
            inputs.forEach(input => {
                input.addEventListener('input', () => {
                    if (!errorMessage.classList.contains('hidden')) {
                        errorMessage.classList.add('hidden');
                    }
                });
            });
        });
        
        function createParticles() {
            const container = document.getElementById('particles-container');
            const particleCount = Math.floor(window.innerWidth / 10);
            
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.classList.add('particle');
                
                // Random size between 1px and 3px
                const size = Math.random() * 2 + 1;
                particle.style.width = `${size}px`;
                particle.style.height = `${size}px`;
                
                // Random position
                particle.style.left = `${Math.random() * 100}%`;
                particle.style.top = `${Math.random() * 100}%`;
                
                // Random animation
                const duration = Math.random() * 20 + 10;
                const delay = Math.random() * 5;
                particle.style.animation = `float ${duration}s ease-in-out ${delay}s infinite`;
                
                container.appendChild(particle);
            }
            
            // Add floating animation
            const style = document.createElement('style');
            style.innerHTML = `
                @keyframes float {
                    0% {
                        transform: translate(0, 0) rotate(0deg);
                        opacity: 1;
                    }
                    50% {
                        transform: translate(${Math.random() * 100 - 50}px, ${Math.random() * 100 - 50}px) rotate(180deg);
                        opacity: 0.5;
                    }
                    100% {
                        transform: translate(0, 0) rotate(360deg);
                        opacity: 1;
                    }
                }
            `;
            document.head.appendChild(style);
        }
    </script>
</body>
</html>
